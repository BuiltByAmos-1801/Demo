<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stake</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" aria-labelledby="page-title">
    <h1 id="page-title">Aviator Predictor <span>v12.0.5</span></h1>

    <div class="plane" aria-hidden="true">
      <svg viewBox="0 0 260 150" role="img">
        <defs>
          <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        </defs>
        <g fill="#ce1231" stroke="#1a0509" stroke-width="3" stroke-linejoin="round" filter="url(#shadow)">
          <path d="M32 99 111 76 189 96 121 115Z"/>
          <path d="M111 76 160 28 168 31 139 79Z"/>
          <path d="M121 112 190 100 215 112 162 121Z"/>
          <path d="M77 88 46 68 22 71 55 100Z"/>
          <path d="M121 115 107 137 73 132 80 122 109 123Z"/>
          <path d="M171 63 201 15 211 18 199 72Z"/>
          <path d="M174 72 221 58 241 67 194 85Z"/>
          <path d="M153 31 180 4 186 5 174 39Z"/>
          <path d="M184 16 188 39 181 43Z"/>
          <circle cx="151" cy="67" r="13" fill="#090909"/>
          <circle cx="151" cy="67" r="6" fill="#e51b40"/>
          <path d="M132 87 155 81 174 88 153 94Z" fill="#ef2344"/>
        </g>
      </svg>
    </div>

    <form id="activation-form" autocomplete="off">
      <label for="activation-code">Activation Code</label>
      <div class="code-box">
        <button class="copy-button" id="copy-button" type="button" aria-label="Copy activation code">
          <span class="copy-icon">⌕</span>
        </button>
        <input id="activation-code" type="password" inputmode="numeric" value="" placeholder="••••••••••" maxlength="10" aria-describedby="status">
      </div>
      <button class="refresh-button" id="refresh-button" type="button" aria-label="Clear activation code">
        <span>↻</span>
      </button>
      <p id="status" class="status" aria-live="polite"></p>
      <button class="continue-button" type="submit">CONTINUE</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
