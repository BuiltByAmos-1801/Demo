<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stake</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" aria-labelledby="page-title">
    <img class="stake-logo" src="images/stake-full.B38fTPet.svg" alt="Stake logo">
    <h1 id="page-title">Stake</h1>

    <form id="activation-form" autocomplete="off">
      <label for="activation-code">Activation Code</label>
      <div class="code-box">
        <button class="copy-button" id="copy-button" type="button" aria-label="Copy activation code">
          <span class="copy-icon">⌕</span>
        </button>
        <input id="activation-code" type="password" inputmode="numeric" value="" placeholder="••••••••••" maxlength="10" aria-describedby="status">
      </div>
      <button class="refresh-button" id="refresh-button" type="button" aria-label="Clear activation code">
        <span>↻</span>
      </button>
      <p id="status" class="status" aria-live="polite"></p>
      <button class="continue-button" type="submit">CONTINUE</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
